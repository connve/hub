# Searches Salesforce records with SOSL, as an MCP tool for agents, with a
# prompt that uses it. The toolset's instructions are resources/salesforce/instructions.md.
flow:
  labels:
    display_name: "Salesforce Search"
    description: "Finds Salesforce accounts, contacts, leads, opportunities, cases and activities by a search term, for agents."
    tags: ["salesforce", "sosl", "mcp"]
  tasks:
    - mcp_tool:
        name: salesforce_search
        description: "Search Salesforce accounts, contacts, leads, opportunities, cases, tasks and events by a search term, matching words that start with it."
        input_schema:
          type: object
          properties:
            search_term:
              type: string
              minLength: 2
              description: "Words to find in any field, at least 2 characters."
          required: [search_term]

    # The objects and fields to search; the trailing * also finds words that start with the term.
    - salesforce_restapi_search:
        name: search
        credentials_path: "{{env.FLOWGEN_CREDENTIALS}}/salesforce.json"
        query:
          resource: salesforce/search.sosl

    # Finds a customer with the tool and says which record is meant.
    - mcp_prompt:
        name: find_customer
        description: "Find a customer in Salesforce by name, email or company, with their open deals, cases and recent activity."
        arguments:
          - name: customer
            description: "A name, email or company."
            required: true
        template:
          resource: salesforce/find_customer.md
